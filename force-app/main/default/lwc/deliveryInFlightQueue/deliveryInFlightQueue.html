<template>
    <template lwc:if={isNotHiddenOnHome}>
    <div class="queue-card">

        <div class="queue-header">
            <div class="queue-header-left">
                <lightning-icon icon-name="standard:work_plan" alternative-text="In flight" size="small" class="queue-header-icon"></lightning-icon>
                <div>
                    <h2 class="queue-title">In Flight</h2>
                    <p class="queue-subtitle">Approved and being worked &mdash; Ready for Development through Deploying</p>
                </div>
            </div>
            <div class="queue-controls">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={handleRefresh}>
                </lightning-button-icon>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="queue-loading">
                <lightning-spinner alternative-text="Loading in-flight list..." size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasError}>
            <div class="queue-error">
                <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template lwc:if={hasRows}>
            <div class="queue-headline-row">
                <span class="queue-headline">{headlineDisplay}</span>
                <lightning-button
                    variant="neutral"
                    label="Open full report"
                    icon-name="utility:new_window"
                    disabled={hasNoReport}
                    onclick={handleOpenReport}>
                </lightning-button>
            </div>

            <ul class="queue-list">
                <template for:each={rows} for:item="row">
                <li key={row.key} class="queue-row">
                    <div class="queue-row-main">
                        <div class="queue-row-info">
                            <button class="queue-item-link"
                                    data-work-item-id={row.workItemId}
                                    onclick={handleItemClick}>{row.name}</button>
                            <template lwc:if={row.hasBrief}>
                                <div class="queue-row-brief">{row.briefDescription}</div>
                            </template>
                            <div class="queue-row-meta">
                                <span class="queue-stage">{row.stageDisplay}</span>
                                <span class="queue-dev">{row.developerDisplay}</span>
                                <span class="queue-hours">{row.hoursDisplay}</span>
                                <span class="queue-age">{row.ageDisplay}</span>
                            </div>
                        </div>
                    </div>
                </li>
                </template>
            </ul>
        </template>

        <template lwc:if={isEmpty}>
            <div class="queue-empty">
                <lightning-icon icon-name="utility:success" size="medium" class="queue-empty-icon"></lightning-icon>
                <p>Nothing in flight &mdash; approve something above to start it.</p>
            </div>
        </template>

    </div>
    </template>
</template>
